services:
  mysql:
    image: mysql:8.0
    container_name: inventarios_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: stardust
      MYSQL_DATABASE: inventarios_db
    ports:
      - "3307:3306"  # Cambiado: puerto 3307 en tu PC, 3306 en el contenedor
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data: